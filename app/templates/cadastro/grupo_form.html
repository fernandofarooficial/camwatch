{% extends "cadastro/base_cadastro.html" %}

{% block cadastro_content %}

<div class="form-card">
  <h2 class="form-title">
    {{ 'Editar grupo' if grupo else 'Novo grupo' }}
  </h2>

  <form method="POST">

    {% if empresa_restrita %}
    <div class="form-row">
      <label>Empresa</label>
      <span class="form-value-static">{{ empresas[0].nome }}</span>
      <input type="hidden" name="empresa_id" value="{{ empresas[0].id }}">
    </div>
    {% else %}
    <div class="form-row">
      <label for="empresa_id">Empresa <span class="obrigatorio">*</span></label>
      <select id="empresa_id" name="empresa_id" required>
        <option value="">Selecione...</option>
        {% for e in empresas %}
          <option value="{{ e.id }}"
            {% if grupo and grupo.empresa_id == e.id %}selected
            {% elif request.form.get('empresa_id')|int == e.id %}selected
            {% endif %}>
            {{ e.nome }}
          </option>
        {% endfor %}
      </select>
    </div>
    {% endif %}

    <div class="form-row">
      <label for="nome">Nome <span class="obrigatorio">*</span></label>
      <input type="text" id="nome" name="nome"
             value="{{ grupo.nome if grupo else '' }}"
             placeholder="Ex: Câmeras externas, Recepção..."
             required maxlength="100">
    </div>

    <div class="form-row">
      <label for="descricao">Descrição</label>
      <input type="text" id="descricao" name="descricao"
             value="{{ grupo.descricao if grupo else '' }}"
             placeholder="Descrição opcional"
             maxlength="255">
    </div>

    <div class="form-row">
      <label for="telegram">Telegram <span class="form-hint">(chat_id para notificações)</span></label>
      <input type="text" id="telegram" name="telegram"
             value="{{ grupo.telegram if grupo else '' }}"
             placeholder="Ex: -1001234567890"
             maxlength="20">
    </div>

    <div class="form-acoes">
      <a href="{{ url_for('cadastro.grupos') }}" class="btn-cancelar">Cancelar</a>
      <button type="submit" class="btn-salvar">
        {{ 'Salvar alterações' if grupo else 'Cadastrar' }}
      </button>
    </div>

  </form>
</div>

{% endblock %}
